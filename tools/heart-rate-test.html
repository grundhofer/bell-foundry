<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puls-Test</title>
    <style>
      :root {
        --bg: #111;
        --fg: #eee;
        --dim: #888;
        --accent: #e5484d;
        --ok: #46a758;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.4 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 16px;
      }
      button {
        font: inherit;
        font-size: 18px;
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #bpm {
        font-size: min(30vw, 160px);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      #bpm.beat {
        animation: beat 0.25s ease-out;
      }
      @keyframes beat {
        0% {
          transform: scale(1.08);
          color: var(--accent);
        }
        100% {
          transform: scale(1);
        }
      }
      .row {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: center;
        color: var(--dim);
      }
      .row b {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      #status {
        color: var(--dim);
        text-align: center;
        max-width: 40em;
      }
      #status.err {
        color: var(--accent);
      }
      #status.ok {
        color: var(--ok);
      }
      canvas {
        width: min(100%, 700px);
        height: 160px;
        background: #1a1a1a;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <button id="connect">Pulsband verbinden</button>
    <div id="bpm">--</div>
    <div class="row">
      <span>geglättet: <b id="smooth">--</b></span>
      <span>min/max: <b id="minmax">--</b></span>
      <span>Hautkontakt: <b id="contact">--</b></span>
      <span>RR: <b id="rr">--</b></span>
    </div>
    <canvas id="chart" width="1400" height="320"></canvas>
    <div id="status">Chrome oder Edge nötig. Vorher in der Zepp-App die Herzfrequenz-Übertragung einschalten.</div>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      function setStatus(text, cls = '') {
        statusEl.textContent = text;
        statusEl.className = cls;
      }

      if (!navigator.bluetooth) {
        setStatus(
          'Web Bluetooth fehlt. Bitte Chrome oder Edge nutzen und die Seite über http://localhost öffnen (nicht als Datei).',
          'err',
        );
        $('connect').disabled = true;
      }

      const history = [];
      const WINDOW_MS = 120000;
      let smooth = null,
        min = Infinity,
        max = -Infinity,
        device = null;

      $('connect').onclick = async () => {
        try {
          setStatus('Suche Geräte mit Herzfrequenz-Dienst …');
          device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
          device.addEventListener('gattserverdisconnected', onDisconnect);
          await connect();
        } catch (e) {
          setStatus(
            'Fehler: ' +
              e.message +
              ' (Taucht das Band nicht auf, sendet es den Standard-Herzfrequenz-Dienst nicht oder die Übertragung ist aus.)',
            'err',
          );
        }
      };

      async function connect() {
        setStatus('Verbinde mit ' + (device.name || 'Gerät') + ' …');
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('heart_rate');
        const ch = await service.getCharacteristic('heart_rate_measurement');
        ch.addEventListener('characteristicvaluechanged', (e) => onMeasurement(e.target.value));
        await ch.startNotifications();
        setStatus('Verbunden mit ' + (device.name || 'Gerät') + '. Der Standard-Dienst funktioniert.', 'ok');
        $('connect').disabled = true;
      }

      async function onDisconnect() {
        setStatus('Verbindung verloren, versuche neu zu verbinden …', 'err');
        for (let i = 0; i < 5; i++) {
          try {
            await connect();
            return;
          } catch {
            await new Promise((r) => setTimeout(r, 2000));
          }
        }
        setStatus('Neu verbinden fehlgeschlagen. Bitte erneut auf den Knopf drücken.', 'err');
        $('connect').disabled = false;
      }

      // Parse Bluetooth Heart Rate Measurement (0x2A37).
      function onMeasurement(dv) {
        const flags = dv.getUint8(0);
        let i = 1;
        const bpm = flags & 0x01 ? dv.getUint16(i, true) : dv.getUint8(i);
        i += flags & 0x01 ? 2 : 1;

        const contactSupported = flags & 0x04;
        const contact = flags & 0x02;
        $('contact').textContent = contactSupported ? (contact ? 'ja' : 'NEIN') : 'k. A.';

        if (flags & 0x08) i += 2; // Skip the optional energy field.
        const rrs = [];
        if (flags & 0x10) {
          for (; i + 1 < dv.byteLength; i += 2) rrs.push(Math.round((dv.getUint16(i, true) / 1024) * 1000));
        }
        $('rr').textContent = rrs.length ? rrs.join(', ') + ' ms' : '--';

        if (!bpm) return;
        smooth = smooth == null ? bpm : smooth + 0.15 * (bpm - smooth);
        min = Math.min(min, bpm);
        max = Math.max(max, bpm);

        const el = $('bpm');
        el.textContent = bpm;
        el.classList.remove('beat');
        void el.offsetWidth;
        el.classList.add('beat');
        $('smooth').textContent = smooth.toFixed(1);
        $('minmax').textContent = min + ' / ' + max;

        const now = performance.now();
        history.push({ t: now, bpm, smooth });
        while (history.length && now - history[0].t > WINDOW_MS) history.shift();
        draw();
      }

      function draw() {
        const c = $('chart'),
          g = c.getContext('2d'),
          W = c.width,
          H = c.height;
        g.clearRect(0, 0, W, H);
        if (history.length < 2) return;
        const vals = history.map((p) => p.bpm);
        const lo = Math.min(...vals) - 5,
          hi = Math.max(...vals) + 5;
        const now = history[history.length - 1].t;
        const x = (t) => W - ((now - t) / WINDOW_MS) * W;
        const y = (v) => H - ((v - lo) / (hi - lo)) * H;

        g.fillStyle = '#666';
        g.font = '24px system-ui';
        g.fillText(Math.round(hi), 8, 28);
        g.fillText(Math.round(lo), 8, H - 10);

        const line = (key, color, width) => {
          g.beginPath();
          g.strokeStyle = color;
          g.lineWidth = width;
          history.forEach((p, k) => (k ? g.lineTo(x(p.t), y(p[key])) : g.moveTo(x(p.t), y(p[key]))));
          g.stroke();
        };
        line('bpm', '#555', 3);
        line('smooth', '#e5484d', 5);
      }
    </script>
  </body>
</html>
