<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Bell Foundry</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="One duel in a flooded bell foundry, fought with a real sword and shield." />
    <meta name="theme-color" content="#05070b" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bell Foundry" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Bell Foundry" />
    <meta property="og:title" content="The Bell Foundry" />
    <meta
      property="og:description"
      content="One duel in a flooded bell foundry, fought with a real sword and shield."
    />
    <style>
      /* Disable browser gestures during play. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      @media (pointer: coarse) {
        html,
        body {
          overscroll-behavior: none;
        }
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
  </head>
  <body>
    <canvas id="view" tabindex="0" aria-label="The Bell Foundry game view"></canvas>
    <div id="ui"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
