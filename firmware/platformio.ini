; Use the ESP32-S3 dev kit with StickS3 flash and PSRAM settings. M5Unified detects the board.

[platformio]
default_envs = sword, shield, atom, atoms3

[common]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

[stick]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter = +<stick/>
lib_deps =
    m5stack/M5GFX@0.3.0
    m5stack/M5Unified@0.3.0
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:sword]
extends = stick
build_flags =
    ${stick.build_flags}
    -DDEVICE_ID=1
    -DHAS_VIBRATION=1
    -DHAS_JOYSTICK=0

[env:shield]
extends = stick
build_flags =
    ${stick.build_flags}
    -DDEVICE_ID=2
    -DHAS_VIBRATION=0
    -DHAS_JOYSTICK=1

[env:atom]
extends = common
board = m5stack-atom
build_src_filter = +<atom/>
monitor_speed = 921600

; AtomS3 Lite uses USB Serial/JTAG. The baud rate is ignored.
[env:atoms3]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter = +<atom/>
monitor_speed = 921600
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DATOM_LED_PIN=35
    -DATOM_BTN_PIN=41
